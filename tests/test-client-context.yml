name: Test ClientContext input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate base64 ClientContext
        id: ctx
        run: |
          # ClientContext must be base64-encoded JSON (up to 3583 bytes)
          CTX=$(echo '{"custom":{"myKey":"myValue"},"env":{"test":"true"}}' | base64 -w 0)
          echo "value=$CTX" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          REGION: us-east-1
          FunctionName: test-function
          InvocationType: RequestResponse
          ClientContext: ${{ steps.ctx.outputs.value }}
      - name: Assert action ran with ClientContext input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because the AWS credentials are fake,
          # but it must not fail due to missing required inputs or invalid ClientContext format.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with fake credentials (ClientContext was accepted)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
