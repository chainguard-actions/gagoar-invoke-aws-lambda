name: Test AWS_SESSION_TOKEN input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_SESSION_TOKEN: AQoDYXdzEJr//////////wEaoAK1wvxJY12r2IWAsdFakeSessionToken
          REGION: us-east-1
          FunctionName: test-function
          InvocationType: RequestResponse
          Payload: '{"key":"value"}'
      - name: Assert action ran with session token input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because the AWS credentials are fake,
          # but it must not fail due to missing required inputs.
          # A failure here means the action processed the AWS_SESSION_TOKEN input.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with fake credentials (AWS_SESSION_TOKEN was accepted)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
